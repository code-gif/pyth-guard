[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pythmon"
version = "0.1.0"
description = "Off-chain drift monitor for Pyth Pro price feeds consumed on Cardano"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "websockets>=13.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
pythmon = "pythmon.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pythmon"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
